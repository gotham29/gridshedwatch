      material_action: {pass: true, basis: "EEA 2 earlier that day enabled emergency demand response; statewide conservation appeal; record peak 52,061 MW"}
      no_firm_shed: {pass: true, basis: "CAISO did not order load shed; EEA 3 downgraded to EEA 2 at 20:00. Six NCPA member cities shed 46 MW at 17:53, mostly restored within the hour, after NCPA's dispatcher misinterpreted the EEA 3 as a load shed request (Cal Advocates): not operator-directed, and far below the 250 MW Tier 1 floor"}
      verifiable: {pass: true, basis: "CAISO news release (declaration time); Cal Advocates timeline (EEA 1 10:09 effective 16:00, EEA 2 13:55, EEA 3 17:17, EEA 2 20:00); Utility Dive"}
    actions:
