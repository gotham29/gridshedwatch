      - {action: public conservation appeal, mw: null, source: utilitydive}
    decision: include
    reason: "Passes all four tests"
    found_by: "CAISO grid emergencies history, then news and Cal Advocates cross-check"
    sources:
      caiso_release: {title: "Rotating power outages are now possible to protect grid", publisher: CAISO, url: "https://www.caiso.com/Documents/rotating-power-outages-are-now-possible-to-protect-grid.pdf"}
      utilitydive: {title: "California ISO narrowly avoids outages but warns as peak demand hits record", publisher: Utility Dive, url: "https://utilitydive.com/news/california-iso-narrowly-avoids-outages-but-warns-as-peak-demand-hits-record/631280"}
      caladvocates: {title: "September 2022 heat wave: preliminary analysis", publisher: Public Advocates Office (CPUC), url: "https://www.publicadvocates.cpuc.ca.gov/-/media/cal-advocates-website/files/press-room/reports-and-analyses/220922-caladvocates-sept-22-heat-wave-analysis---full.pdf"}

  - id: nevp_2020-08-18
    grid: Nevada (NV Energy)
    eia930_respondent: NEVP
    date_local: 2020-08-18
    declared: {level: EEA 3, local: "2020-08-18 15:30 PDT", utc: "2020-08-18 22:30", ended_local: "after 21:00 PDT (back to EEA 1)"}
