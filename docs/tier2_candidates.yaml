# Aug 2020 heat wave (WECC August 2020 Heatwave Event Analysis Report; WIRAB staff report): 18 EEAs,
# six balancing authorities reached EEA 3, only CAISO shed load (Aug 14-15). Named so far: CAISO
# (Tier 1) and NV Energy (Aug 18, Tier 2). The other four are anonymized (BA1-BA10 in WIRAB's charts);
# names depend on the RC West / WECC requests. Public appeals the same week by APS, SRP (after a
# Salt Fire transmission outage on Aug 19), NV Energy and Redding are not themselves EEA 3 evidence.

# Lists still to obtain: MISO's own history of Max Gen declarations ("Maximum Generation Emergency
# Declarations through June 2024", MISO OASIS document Capacity_Emergency_Historical_Information.pdf)
# and PJM's Emergency Procedures postings archive (emergencyprocedures.pjm.com), which tags each
# posting with its NERC EEA level.

