    decision: include
    reason: "Passes all four tests. Time zone of the PUCN times assumed Pacific (NV Energy and RC West both operate on Pacific time); confirm if a source states it"
    found_by: "web search (NV Energy EEA 2020), then OE-417 cross-check"
    sources:
