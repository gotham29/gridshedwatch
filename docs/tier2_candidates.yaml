# GridShedWatch Tier 2: every candidate checked, with the four tests and the decision.
# The rule (docs/events.md, Tier 2) is fixed before any candidate is scored. A candidate is
# included only if all four tests pass. Excluded candidates stay in this file with the reason,
# so the list can be audited. Included events move to the benchmark's event file at release.
#
# Tests
#   top_level:       EEA 3 (NERC EOP-011: firm load interruption imminent or in progress) or the
#                    operator's documented equivalent, declared for lack of supply or reserves
#   material_action: at least one documented emergency action (demand response or interruptible
#                    load, emergency imports, reserves below requirement, curtailment of large
#                    customers, or a public conservation appeal made under the emergency)
#   no_firm_shed:    the operator did not direct firm load shed (otherwise the event is Tier 1)
#   verifiable:      declaration time from an official source, plus an independent second source
#
# Fields: id, grid, eia930_respondent, date_local, declared (level, local, utc), tests
# (each: pass true / false / null while pending, and basis), actions, decision
# (include / exclude / pending), reason, sources. Times: local as published, utc converted.

version: tier2-draft

# What each operator's levels mean, so "EEA 3 or equivalent" is applied the same way everywhere.
levels:
  CISO:
    eea3: "EEA 3: all actions exhausted, reserves cannot be met, firm load shed possible (CAISO Emergency Notifications fact sheet)"
    note: "Before 2022 CAISO used Stage 1/2/3; Stage 3 = load interruption imminent or in progress."
    source: https://www.caiso.com/documents/emergency-notifications-fact-sheet.pdf
  ERCO:
    eea3: "EEA 3: reserves below 1,500 MW or frequency below 59.8 Hz; ERCOT orders controlled outages"
    note: "In ERCOT an EEA 3 always comes with firm load shed, so an ERCOT EEA 3 is Tier 1, never Tier 2."
    source: https://www.ercot.com/files/docs/2023/06/20/2024-Energy-Emergency-Alert-Overview.pdf
  PJM:
    eea3: "Manual Load Dump Warning (shed imminent) and Manual Load Dump Action (shed) - Capacity Emergency - NERC EEA 3"
    note: "Emergency Load Management Reduction, Deploy All Resources and Voltage Reduction are EEA 2. A real Manual Load Dump Warning without an Action would be Tier 2."
    checked: "All PJM Emergency Procedures postings 2020-01-01 to 2026-10-28 filtered on 'Load Dump' (Oct 28, 2026): only drills (2 per year). No capacity EEA 3. Winter Storm Elliott (Dec 23-24, 2022) peaked at EEA 2 (Emergency Load Management Reductions). Local Load Shed Directives (AEP June 14-15, 2022, derecho damage; BGE Aug 11, 2025, 15:52-16:20, msg 104779, to keep post-contingency flow on the 115 kV Chestnut-Fredrick Rd line below its load dump rating) are transmission-related, not capacity emergencies"
    source: https://emergencyprocedures.pjm.com/ep/pages/dashboard.jsf
  MISO:
    eea3: "Max Gen Event Step 5 declares EEA 3 with load shed; Steps 3a and 4b declare EEA 3 when contingency reserves stay below the requirement (more than 30 minutes, no fix within 90), without requiring load shed"
    note: "Step 1b = EEA 1, Step 2a = EEA 2. So MISO can have a Tier 2 event (EEA 3 under Step 3a or 4b, no shed)."
    source: https://cdn.misoenergy.org/SO-P-EOP-11-002%20Rev%2023%20MISO%20Market%20Capacity%20Emergency683501.pdf

candidates:
