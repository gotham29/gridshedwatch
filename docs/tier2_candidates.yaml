  - id: erco_2023-09-06
    grid: Texas (ERCOT)
    eia930_respondent: ERCO
    date_local: 2023-09-06
    declared: {level: EEA 2, local: null, utc: null}   # time not in the ERCOT release; to source
    tests:
      top_level: {pass: false, basis: "Highest level EEA 2; in ERCOT an EEA 3 means controlled outages"}
      material_action: {pass: true, basis: "Reserves below 1,750 MW and declining; demand response deployed; conservation appeal 6-9 p.m. CT"}
      no_firm_shed: {pass: true, basis: "No controlled outages"}
      verifiable: {pass: null, basis: "ERCOT release confirms EEA 2 but not its time; declaration time and a second source still to find"}
    decision: exclude
    reason: "Highest level EEA 2, below the top-level test. ERCOT declares EEA 3 only with controlled outages, so it cannot have a Tier 2 event (strict EEA 3, approved Oct 28)"
    sources:
      ercot_release: {title: "ERCOT has initiated Energy Emergency Alert Level 2", publisher: ERCOT, url: "https://www.ercot.com/news/release/2023-09-06-ercot-has-initiated"}

