# GridShedWatch v1.0 events: every operator-initiated firm load shed caused by insufficient
# supply in North America, Jan 2020 - Sep 2026, of at least 250 MW at its worst, in a balancing
# authority that reports D, DF and NG to EIA-930. Source list: NERC State of Reliability reports.
# Selection rule, exclusions and onset fallback: docs/events.md. Times: onset_utc is what scoring uses.
# split: the three development events were used to design the shared alert rules; the five
# held-out events were scored once after the rules were frozen.
version: '1.0'
events:
  tx:
    grid: Texas (ERCOT)
    eia930_respondent: ERCO
    local_tz: America/Chicago
    storm: Uri
    event: uri_feb2021
    onset_local: 2021-02-15 01:20
    onset_utc: 2021-02-15 07:20
    onset_basis: EEA 3 declared, rotating outages
    max_shed_mw: 20000
    source: ERCOT; FERC-NERC Uri report
    split: development
    cause: Generation outages, derates and failures to start in extreme cold (freezing 44%, fuel supply 31%); ERCOT averaged 34,000 MW of expected generation unavailable for over two days
    impact:
      shed_mw: 20000
      customers: more than 4.5 million people in Texas lost power (all causes, including weather damage)
      duration: nearly three consecutive days of controlled outages
    response:
    - first 1,000 MW of load shed ordered at 01:20 Feb 15
    - load shed peaking at 20,000 MW by 19:00 Feb 15
    - public conservation appeals
    note: At least 210 deaths; Federal Reserve Bank of Dallas estimate of $80 to 130 billion in losses to the Texas economy (both cited in the FERC-NERC report)
    sources:
      onset:
        title: The February 2021 Cold Weather Outages in Texas and the South Central United States (p. 14)
        publisher: FERC-NERC-Regional Entity staff
        url: https://nerc.com/pa/rrm/ea/Documents/February_2021_Cold_Weather_Report.pdf
      impact:
        title: The February 2021 Cold Weather Outages in Texas and the South Central United States (pp. 9-10, 14)
        publisher: FERC-NERC-Regional Entity staff
        url: https://nerc.com/pa/rrm/ea/Documents/February_2021_Cold_Weather_Report.pdf
      independent:
        title: 'DOE OE-417, 2021: ERCOT and distribution utilities'' firm load shed reports, Feb 15'
        publisher: DOE / EIA
        url: https://www.eia.gov/electricity/data/disturbance/disturb_events_archive.html
  ca:
    grid: California (CAISO)
    eia930_respondent: CISO
    local_tz: America/Los_Angeles
    storm: Aug 2020 heat wave
    event: heatwave_aug2020
    onset_local: 2020-08-14 18:38
    onset_utc: 2020-08-15 01:38
    onset_basis: Stage 3 Emergency declared
    max_shed_mw: 1000
    source: CAISO Final Root Cause Analysis, Mid-August 2020
    split: development
    cause: Extreme West-wide heat; resource planning short of demand at the early-evening net peak; day-ahead market practices that worsened the shortfall (CAISO preliminary root cause analysis)
    impact:
      shed_mw: 1000
      customers: about 492,000 on Aug 14 (out 15 to 150 minutes) and 321,000 on Aug 15 (8 to 90 minutes)
      duration: rotating outages for about an hour on Aug 14; Stage 3 for 20 minutes on Aug 15
    response:
    - Stage 3 Emergency declared at 18:38 Aug 14
    - two 500 MW rotating-outage phases ordered on Aug 14
    - a second Stage 3 and shed on Aug 15
    sources:
      onset:
        title: Preliminary Root Cause Analysis, Mid-August 2020 Heat Storm
        publisher: CAISO, CPUC and CEC
        url: https://www.caiso.com/documents/preliminary-root-cause-analysis-rotating-outages-august-2020.pdf
      impact:
        title: Preliminary Root Cause Analysis, Mid-August 2020 Heat Storm
        publisher: CAISO, CPUC and CEC
        url: https://www.caiso.com/documents/preliminary-root-cause-analysis-rotating-outages-august-2020.pdf
      independent:
        title: 'DOE OE-417, 2020: CAISO, PG&E and SCE firm load shed reports, Aug 14-15'
        publisher: DOE / EIA
        url: https://www.eia.gov/electricity/data/disturbance/disturb_events_archive.html
  tva:
    grid: Tennessee Valley Authority
    eia930_respondent: TVA
    local_tz: America/New_York
    storm: Elliott
    event: elliott_dec2022
    onset_local: 2022-12-23 06:12
    onset_utc: 2022-12-23 11:12
    onset_basis: EEA 3 declared (source gives Eastern time)
    max_shed_mw: 3000
    source: FERC-NERC Elliott inquiry, p. 10
    split: development
    cause: Unplanned generation outages in extreme cold with record December demand (Winter Storm Elliott)
    impact:
      shed_mw: 3000
      customers: not published as a count; about 10% of firm load across TVA's 153 local power companies
      duration: 7 hours in total (FERC-NERC Figure 4), in two instances on Dec 23 and Dec 24
    response:
    - EEA 3 declared by 06:12 EST Dec 23
    - firm load shed of over 1,500 MW on Dec 23
    - 5% then 10% of peak load shed early Dec 24
    sources:
      onset:
        title: Inquiry into Bulk-Power System Operations During December 2022 Winter Storm Elliott (p. 10)
        publisher: FERC-NERC-Regional Entity staff
        url: https://www.ferc.gov/sites/default/files/2023-11/24_Winter-Storm_Elliot_1107_1300.pdf
      impact:
        title: Inquiry into Bulk-Power System Operations During December 2022 Winter Storm Elliott (pp. 11-14)
        publisher: FERC-NERC-Regional Entity staff
        url: https://www.ferc.gov/sites/default/files/2023-11/24_Winter-Storm_Elliot_1107_1300.pdf
      independent:
        title: 'DOE OE-417, 2022: TVA firm load shed report, Dec 22-25 (3,200 MW)'
        publisher: DOE / EIA
        url: https://www.eia.gov/electricity/data/disturbance/disturb_events_archive.html
  spp:
    grid: Southwest Power Pool
    eia930_respondent: SWPP
    local_tz: America/Chicago
    storm: Uri
    event: uri_feb2021
    onset_local: 2021-02-15 10:08
    onset_utc: 2021-02-15 16:08
    onset_basis: EEA 3 declared
    max_shed_mw: 2718
    source: SPP; FERC-NERC Uri report
    split: held-out
