      duration: over four hours across Feb 15 (610 MW, 12:04-13:01) and Feb 16 (2,718 MW, 06:44-10:07)
    response:
    - EEA 3 declared at 10:08 Feb 15
    - firm load shed instructed on Feb 15 and Feb 16
    - member utilities issued public conservation appeals
    sources:
      onset:
        title: SPP grid emergency presentation to the Oklahoma Corporation Commission (Mar 18, 2021)
        publisher: SPP
        url: https://aem-prod.oklahoma.gov/content/dam/ok/en/occ/documents/ajls/commissioners/03-18-2021-spp-grid-emergency-presentation-for-occ.pdf
      impact:
        title: The February 2021 Cold Weather Outages in Texas and the South Central United States (p. 14)
        publisher: FERC-NERC-Regional Entity staff
        url: https://nerc.com/pa/rrm/ea/Documents/February_2021_Cold_Weather_Report.pdf
      independent:
        title: 'DOE OE-417, 2021: SPP firm load shed report, Feb 14-18'
        publisher: DOE / EIA
        url: https://www.eia.gov/electricity/data/disturbance/disturb_events_archive.html
  miso:
    grid: MISO (MISO South)
    eia930_respondent: MISO
    local_tz: America/New_York
    storm: Uri
    event: uri_feb2021
    onset_local: 2021-02-16 19:40
    onset_utc: 2021-02-17 00:40
    onset_basis: Max Gen Event Step 5 (EEA 3) declared for MISO South; 700 MW load reduction for capacity shortage (Feb 15-16
      transmission-emergency sheds excluded by rule)
    max_shed_mw: 700
    source: MISO, The February 2021 Arctic Event (report times in EST)
    split: held-out
    cause: Generation outages in extreme cold in MISO South (14,500 MW of expected capacity unavailable on average Feb 16 to 18)
    impact:
      shed_mw: 700
      customers: not reported
      duration: 2 hours 20 minutes (19:40-22:00 EST Feb 16)
    response:
    - Max Gen Event Step 5 (EEA 3) with a 700 MW load shed instruction at 19:40 EST Feb 16
    - separate transmission-emergency sheds on Feb 15-16 are excluded by rule
    sources:
      onset:
        title: The February Arctic Event (Feb 14-18, 2021)
        publisher: MISO
        url: https://www.efis.psc.mo.gov/Document/Display/82729
      impact:
        title: The February 2021 Cold Weather Outages in Texas and the South Central United States (p. 15)
        publisher: FERC-NERC-Regional Entity staff
        url: https://nerc.com/pa/rrm/ea/Documents/February_2021_Cold_Weather_Report.pdf
      independent:
        title: 'DOE OE-417, 2021: MISO firm load shed report, Feb 16 (700 MW)'
        publisher: DOE / EIA
        url: https://www.eia.gov/electricity/data/disturbance/disturb_events_archive.html
  duk:
    grid: Duke Energy Carolinas
    eia930_respondent: DUK
    local_tz: America/New_York
    storm: Elliott
    event: elliott_dec2022
    onset_local: 2022-12-24 06:14
    onset_utc: 2022-12-24 11:14
    onset_basis: 'Fallback: first load-shed directive (EEA 3 time not published)'
    max_shed_mw: 1000
    source: Duke Energy timeline
    split: held-out
    cause: Unplanned generation outages in extreme cold; every member of the Carolinas reserve sharing group was in an EEA and reserve deficient by 05:18 Dec 24
    impact:
      shed_mw: 1000
      customers: about 295,000 (OE-417); about 500,000 across both Duke balancing authorities (FERC-NERC)
      duration: 3 hours of directed firm load shed (FERC-NERC Figure 4); some customers out over ten hours (SC ORS)
    response:
    - 400 MW directed at 06:14 Dec 24
    - two 300 MW steps at 07:00-07:01
    - a further 300 MW step failed when the rotating load shed tool stopped working
    sources:
      onset:
        title: 'Inspection and Examination Report: DEC and DEP December 2022 Winter Storm Outages and Blackouts (Docket ND-2023-1-E, Aug 25, 2023)'
        publisher: South Carolina Office of Regulatory Staff
