      impact:
        title: Inquiry into Bulk-Power System Operations During December 2022 Winter Storm Elliott (p. 14)
        publisher: FERC-NERC-Regional Entity staff
        url: https://www.ferc.gov/sites/default/files/2023-11/24_Winter-Storm_Elliot_1107_1300.pdf
      independent:
        title: 'DOE OE-417, 2022: Duke Energy Carolinas firm load shed report, Dec 24'
        publisher: DOE / EIA
        url: https://www.eia.gov/electricity/data/disturbance/disturb_events_archive.html
  cple:
    grid: Duke Energy Progress
    eia930_respondent: CPLE
    local_tz: America/New_York
    storm: Elliott
    event: elliott_dec2022
    onset_local: 2022-12-24 06:25
    onset_utc: 2022-12-24 11:25
    onset_basis: 'Fallback: first load-shed request (EEA 3 time not published)'
    max_shed_mw: 961
    source: Duke Energy timeline; SC ORS report
    split: held-out
    cause: Unplanned generation outages in extreme cold; every member of the Carolinas reserve sharing group was in an EEA and reserve deficient by 05:18 Dec 24
    impact:
      shed_mw: 961
      customers: about 130,000 (OE-417)
      duration: 2 hours of directed firm load shed (FERC-NERC Figure 4)
    response:
    - 600 MW requested at 06:25 Dec 24
    - rotating load shed tool failed at 06:57
    - further 200 MW and 50 MW requests shed manually
