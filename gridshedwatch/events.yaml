      impact:
        title: Inquiry into Bulk-Power System Operations During December 2022 Winter Storm Elliott (p. 14)
        publisher: FERC-NERC-Regional Entity staff
        url: https://www.ferc.gov/sites/default/files/2023-11/24_Winter-Storm_Elliot_1107_1300.pdf
      independent:
        title: 'DOE OE-417, 2022: Duke Energy Progress firm load shed report, Dec 24'
        publisher: DOE / EIA
        url: https://www.eia.gov/electricity/data/disturbance/disturb_events_archive.html
  lgee:
    grid: LG&E and KU (Kentucky)
    eia930_respondent: LGEE
    local_tz: America/New_York
    storm: Elliott
